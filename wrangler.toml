# wrangler.toml
#
# Used for local testing (`npm run pages:dev` -> `wrangler pages dev`) AND now
# also read by Cloudflare Pages' own build system during real deploys (the
# "Wrangler configuration (BETA)" step in the build log) — so the KV id below
# has to be the real namespace id, not a placeholder, or the deploy fails at
# the "publish Function" step even though the Next.js build itself succeeds.
# Real namespace id came from the Cloudflare dashboard -> Storage & databases
# -> Workers KV -> BOARD_KV.

name = "prototype-workshop"
compatibility_date = "2025-01-01"
pages_build_output_dir = "out"

[[kv_namespaces]]
binding = "BOARD_KV"
id = "fd8a70a4cb5744149f85624a597ac951"
preview_id = "fd8a70a4cb5744149f85624a597ac951"
